<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2c7a">
<meta name="description" content="Mo's shoe shop in Nairobi. Name your price, haggle with Mo by text or out loud, pay with M-Pesa.">
<title>{% block title %}Mo's Shoe Shop{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="sign" href="/">MO<span>'S</span></a>
    <nav>
      <a href="/chat"{% if request.url.path == '/chat' %} aria-current="page"{% endif %}>Haggle</a>
      <a href="/orders"{% if request.url.path.startswith('/orders') %} aria-current="page"{% endif %}>Orders</a>
      <a class="who" href="/profile">{% if me %}{{ me.name.split()[0] }}{% else %}Sign in{% endif %}</a>
    </nav>
  </div>
  <div class="pindo" aria-hidden="true"></div>
</header>

<main>
{% block body %}{% endblock %}
</main>

<footer>
  <div class="pindo" aria-hidden="true"></div>
  <div class="colophon">
    <p>Mo's Shoe Shop, Nairobi. Open as long as Mo is awake.</p>
    <p>Prices in dollars on the tag, charged in shillings by M-Pesa.</p>
  </div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
